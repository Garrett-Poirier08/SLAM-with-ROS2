slam_toolbox:
  ros__parameters:
    # Solver parameters
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Frame & Topic Parameters (Must match your nodes!)
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    # Update rates & resolution
    transform_publish_period: 0.02   # 50 Hz map -> odom TF broadcast
    map_update_interval: 1.0         # Update /map in Foxglove every 1.0 sec
    resolution: 0.05                 # 5 cm per grid cell
    max_laser_range: 12.0            # Match your LiDAR max range (m)
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    # Scan matching & travel thresholds
    # (Set to 0.0 if you want it to map immediately even while stationary)
    minimum_travel_distance: 0.05    # Update map after moving 5 cm
    minimum_travel_heading: 0.05     # Update map after rotating ~2.8 deg
    use_scan_matching: true
    use_scan_barycenter: true
    do_loop_closing: true
